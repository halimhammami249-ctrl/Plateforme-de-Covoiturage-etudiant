<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - Covoiturage Étudiant</title>

    <!-- Ajout Google Fonts pour le design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/modern.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components-ui.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="auth-container">
      <div class="auth-box">
        <h1>Connexion</h1>

        <form
          action="../../backend/controllers/LoginController.php"
          method="POST"
        >
          <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Entrer votre email" name="email" />
          </div>

          <div class="input-group">
            <label>Mot de passe</label>
            <input
              type="password"
              placeholder="Entrer votre mot de passe"
              name="motDePasse"
            />
          </div>

          <button type="submit">Se connecter</button>

          <p class="auth-link">
            Pas de compte ?
            <a href="register.html">Créer un compte</a>
          </p>
        </form>
      </div>
    </div>

    <div id="footer"></div>

    <script src="../js/ui-enhancements.js"></script>
    <script src="../js/components.js"></script>
  </body>
</html>

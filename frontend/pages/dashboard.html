<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- DASHBOARD -->
    <div class="dashboard">
      <!-- HEADER -->
      <div class="welcome-box">
        <h1>Bienvenue</h1>
        <p id="user-info">Chargement...</p>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <div class="card offer">
          <h2>Proposer un trajet</h2>
          <p>Partage ton trajet avec d'autres étudiants</p>
          <a href="publish-trip.html">Commencer</a>
        </div>

        <div class="card find">
          <h2>Rechercher un trajet</h2>
          <p>Trouve une place disponible rapidement</p>
          <a href="search-trip.html">Rechercher</a>
        </div>
      </div>

      <!-- ACTIVITY -->
      <div class="activity">
        <h2>Activité récente</h2>

        <div class="empty">Aucun trajet pour le moment</div>
      </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>

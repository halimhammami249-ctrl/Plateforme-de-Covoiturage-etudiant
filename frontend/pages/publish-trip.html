<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publier un trajet</title>

    <!-- Ajout Google Fonts pour le design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/publish.css" />
    <link rel="stylesheet" href="../css/modern.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/components-ui.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <div class="publish-container">
      <h1>Publier un trajet</h1>

      <form
        id="tripForm"
        action="../../backend/controllers/TrajetController.php"
        method="POST"
      >
        <input
          type="text"
          name="lieuDepart"
          placeholder="Départ (ex: Tunis)"
          required
        />

        <input
          type="text"
          name="destination"
          placeholder="Destination (ex: Ariana)"
          required
        />

        <input type="datetime-local" name="dateHeure" required />

        <input
          type="number"
          name="prixParPlace"
          placeholder="Prix par place"
          required
        />

        <input
          type="number"
          name="nombrePlaces"
          placeholder="Places disponibles"
          required
        />

        <button type="submit">Publier</button>
      </form>

      <p id="msg"></p>
    </div>

    <div id="footer"></div>

    <script src="../js/ui-enhancements.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/trips.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
